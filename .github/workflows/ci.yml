name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow-compliance:
    name: Workflow Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: bash DodgeRain/scripts/check-commit-message.sh --range origin/${{ github.base_ref }}..HEAD

      - name: Check spec reference in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash DodgeRain/scripts/check-spec-reference.sh

      - name: Check test coverage for new code
        run: bash DodgeRain/scripts/check-test-coverage.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run lint
        run: ./gradlew lint
        working-directory: DodgeRain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: DodgeRain/app/build/reports/lint-results-debug.html

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run unit tests with coverage
        run: ./gradlew jacocoCoverageReport
        working-directory: DodgeRain

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        run: |
          diff-cover DodgeRain/app/build/reports/jacoco/jacocoCoverageReport/jacocoCoverageReport.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80 \
            --diff-range-notation=".." \
            --src-roots DodgeRain/app/src/main/java \
            --format html:DodgeRain/app/build/reports/diff-cover.html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: DodgeRain/app/build/reports/tests/testDebugUnitTest/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: DodgeRain/app/build/reports/diff-cover.html

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: DodgeRain

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: DodgeRain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: DodgeRain/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: DodgeRain/app/build/outputs/apk/release/app-release-unsigned.apk
